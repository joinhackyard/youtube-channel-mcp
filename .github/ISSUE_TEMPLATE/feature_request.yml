name: Feature request
description: Suggest a new tool, option or integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The channel task you want your AI to handle, e.g. "bulk-update end screens".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Tool name, inputs, behaviour. Link the YouTube API method if you know it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: api
    attributes:
      label: Checks
      options:
        - label: This is possible with the official YouTube Data or Analytics API (not just in YouTube Studio).
