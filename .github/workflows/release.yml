# Publishes to npm when a version tag (v1.2.3) is pushed to joinhackyard/youtube-channel-mcp.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere, and npm adds provenance automatically.
# Release: bump "version" in package.json, commit, then `git tag v1.2.3 && git push --tags`.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'joinhackyard/youtube-channel-mcp'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"; exit 1
          fi
      - run: npm test
        env:
          YT_MCP_VAULT: file
      - run: npm publish --access public
